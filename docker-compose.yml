services:
  backend:
    build: ./backend
    container_name: universal_gm_backend
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/universal_gm.db
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: universal_gm_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
